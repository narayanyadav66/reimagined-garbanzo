
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>User Login | StudyMatrix</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">
<div class="container min-vh-100 d-flex align-items-center justify-content-center">
    <div class="card border-0 shadow-sm p-4 w-100" style="max-width: 420px;">
        <div class="text-center mb-4">
            <h2 class="fw-bold text-primary">StudyMatrix</h2>
            <p class="text-muted"> User Login</p>
        </div>

        {% if form.errors %}
        <div class="alert alert-danger">
            Invalid username or password. Please try again.
        </div>
        {% endif %}

        {% if next %}
            {% if user.is_authenticated %}
            <div class="alert alert-warning">
                Your account cannot access that page.
            </div>
            {% endif %}
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">

            <div class="mb-3">
                <label class="form-label" for="id_username">Username</label>
                <input class="form-control" type="text" name="username"
                       id="id_username" autocomplete="username"
                       required autofocus>
            </div>

            <div class="mb-3">
                <label class="form-label" for="id_password">Password</label>
                <input class="form-control" type="password" name="password"
                       id="id_password" autocomplete="current-password"
                       required>
            </div>

            <button type="submit" class="btn btn-primary w-100">
                Log In
            </button>
        </form>
    </div>
</div>
</body>
</html>
